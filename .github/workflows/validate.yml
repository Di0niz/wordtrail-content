name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data/
        run: python3 tools/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Web app (web/): domain parity with the iOS app, SW shell list, real lessons.
      - name: Web tests
        run: node --test web/tests/*.test.mjs
      - name: data/ is reproducible from lessons/ + agent/content/
        run: |
          python3 tools/rebuild.py --no-tts
          git status --short
          git diff --exit-code -- data ':!data/audio'
